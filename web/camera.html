<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini 305 · 实时画面</title>
<style>body{margin:0;background:#101c19;color:#edf6f2;font:16px system-ui}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0 auto 0 0}button{background:#89e3b9;color:#10251c;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.4}#stage{margin:22px 0;background:#07100d;border-radius:12px;aspect-ratio:848/480;display:grid;place-items:center;overflow:hidden}img{width:100%;height:100%;object-fit:contain}p{color:#aec7bc;line-height:1.7}#message{padding:20px}#status{color:#89e3b9}[hidden]{display:none!important}</style>
<main><header><h1>Gemini 305 实时画面</h1><button id="start">开始预览</button><button id="stop" disabled>停止</button></header><p id="status" role="status">正在连接 Gemini…</p><div id="stage"><img id="frame" alt="Gemini 305 实时彩色画面" hidden><span id="message">正在读取摄像头…</span></div><p id="detail">仅使用 Gemini 彩色接口 · 不录制、不上传 · 关闭预览约 4 秒后释放摄像头</p></main>
<script>
const img=document.getElementById('frame'),msg=document.getElementById('message'),statusEl=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop');
let active=false,generation=0,url=null,abort=null,timer=null,count=0,at=0,previousId=null;
function halt(){active=false;generation++;clearTimeout(timer);abort?.abort();start.disabled=false;stop.disabled=true;img.hidden=true;img.removeAttribute('src');if(url)URL.revokeObjectURL(url);url=null;msg.hidden=false;msg.textContent='预览已停止';statusEl.textContent='已停止';}
async function frame(g){if(!active||g!==generation)return;abort=new AbortController();const timeout=setTimeout(()=>abort.abort(),5000);try{const r=await fetch('/frame.jpg?t='+Date.now(),{cache:'no-store',signal:abort.signal});if(!r.ok)throw new Error((await r.json()).error);const blob=await r.blob();if(g!==generation)return;const id=r.headers.get('X-Frame-Id');if(id!==previousId){previousId=id;const next=URL.createObjectURL(blob);img.src=next;if(url)URL.revokeObjectURL(url);url=next;count++;}img.hidden=false;msg.hidden=true;statusEl.textContent='● Gemini 实时画面';if(performance.now()-at>1000){document.getElementById('detail').textContent=`Gemini 305 · ${img.naturalWidth} × ${img.naturalHeight} · 预览 ${(count*1000/(performance.now()-at)).toFixed(1)} FPS · 未录制`;count=0;at=performance.now();}}catch(e){if(g!==generation)return;img.hidden=true;msg.hidden=false;msg.textContent=e.name==='AbortError'?'取流超时，正在重试…':e.message;statusEl.textContent='连接异常，正在重试';}finally{clearTimeout(timeout);if(active&&g===generation)timer=setTimeout(()=>frame(g),80);}}
function begin(){halt();active=true;start.disabled=true;stop.disabled=false;count=0;at=performance.now();statusEl.textContent='正在连接 Gemini…';msg.textContent='正在读取 Gemini 彩色接口…';frame(generation);}
start.onclick=begin;stop.onclick=halt;window.addEventListener('pagehide',halt);begin();
</script></html>
